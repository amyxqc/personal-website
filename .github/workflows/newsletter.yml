name: Refresh newsletter panel
on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays, 13:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_newsletter.py, .github/workflows/newsletter.yml]
permissions:
  contents: write
  pages: write
concurrency: newsletter
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow==11.3.0 tzdata
      - run: python scripts/update_newsletter.py
      - name: Commit and publish if the panel changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add index.html img
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh newsletter panel"
          git push
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo "Pages will build from the push."
